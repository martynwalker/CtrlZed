name: Verify detached DOCX picture stability
on:
  push:
    branches: [ beta462-diagnostics ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Publish fixed candidate
        run: dotnet publish CtrlZed.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/CtrlZed
      - name: Repeat document and detached picture checks
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            Remove-Item "$env:TEMP/CtrlZedSelfTestFailure.txt" -ErrorAction SilentlyContinue
            $app = Start-Process artifacts/CtrlZed/CtrlZed.exe -ArgumentList "--self-test" -PassThru
            if (-not $app.WaitForExit(60000)) {
              Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
              throw "Document stability check timed out."
            }
            $app.Refresh()
            Write-Host "CZ462_STABILITY: attempt=$attempt exit=$($app.ExitCode)"
            $progress = Join-Path $env:TEMP "CtrlZedSelfTestProgress.txt"
            if (Test-Path $progress) { Get-Content $progress }
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            if ($app.ExitCode -ne 0) { throw "Document stability failed on attempt $attempt, exit $($app.ExitCode)" }
          }
      - name: Verify Return and page regressions
        if: always()
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--paged-editing-test" -PassThru
          if (-not $t.WaitForExit(120000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Return/navigation test timed out."
          }
          $report = Join-Path $env:TEMP "CtrlZed46PagedEditing.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Return/navigation test failed with code $($t.ExitCode)"
          }
