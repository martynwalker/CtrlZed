name: Beta 34.1 source refinements
on:
  push:
    branches: [ beta341 ]
    paths:
      - ".github/workflows/beta341-apply.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: beta341
      - name: Apply refinements
        shell: pwsh
        run: ./scripts/beta341-apply.ps1
      - name: Commit generated source changes
        shell: pwsh
        run: |
          git config user.name "CtrlZed Build"
          git config user.email "actions@users.noreply.github.com"
          git add AiManager.cs AiResultRenderer.cs MainWindow.GrammarReview.Core.cs DocxInterop.cs
          if (git diff --cached --quiet) { throw "No source changes were produced." }
          git commit -m "Beta 34.1: apply AI progress and DOCX fidelity fixes"
          git push origin HEAD:beta341
