name: Branded beta verification
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  branded-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build CtrlZed.csproj -c Release
      - name: Publish
        run: dotnet publish CtrlZed.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/CtrlZed
      - name: Verify generated icon
        shell: pwsh
        run: |
          if (!(Test-Path "CtrlZed.generated.ico")) { throw "Generated application icon missing" }
          if ((Get-Item "CtrlZed.generated.ico").Length -lt 1000) { throw "Generated application icon is unexpectedly small" }
      - name: Smoke launch
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited) { throw "CtrlZed exited during smoke launch with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Functional self-test
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "CtrlZed self-test failed with code $($t.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/CtrlZed/* -DestinationPath artifacts/CtrlZed-0.9.1-beta.9.1-win-x64.zip
          (Get-FileHash artifacts/CtrlZed-0.9.1-beta.9.1-win-x64.zip -Algorithm SHA256).Hash | Out-File artifacts/CtrlZed-0.9.1-beta.9.1-win-x64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: CtrlZed-0.9.1-beta.9.1-win-x64
          path: |
            artifacts/CtrlZed-0.9.1-beta.9.1-win-x64.zip
            artifacts/CtrlZed-0.9.1-beta.9.1-win-x64.sha256
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.9.1-beta.9.1"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes --cleanup-tag }
          gh release create $tag artifacts/CtrlZed-0.9.1-beta.9.1-win-x64.zip artifacts/CtrlZed-0.9.1-beta.9.1-win-x64.sha256 --prerelease --target "${{ github.sha }}" --title "CtrlZed 0.9.1 beta 9.1" --notes "Branding release: backward-motion CtrlZed icon, native window/taskbar identity, generated Windows executable icon, and branded About box."
