name: Build ColourPicker
on:
  push:
    branches: [ colourpicker-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native Win32 executable
        shell: cmd
        run: call "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat" && cl /nologo /std:c++17 /O2 /EHsc /DUNICODE /D_UNICODE tools\\ColourPicker\\ColourPicker.cpp /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib /OUT:ColourPicker.exe
      - name: Automated tests
        shell: cmd
        run: ColourPicker.exe /test
      - uses: actions/upload-artifact@v4
        with:
          name: ColourPicker-Windows-x64
          path: ColourPicker.exe
