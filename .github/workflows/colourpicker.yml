name: Build ColourPicker
on:
  push:
    branches: [ colourpicker-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Generate Windows icon from embedded swirl artwork
        shell: pwsh
        run: |
          $src = Get-Content 'tools/ColourPicker/ColourPicker.cpp' -Raw
          $m = [regex]::Match($src, 'SWIRL_PNG_B64\s*=\s*"([^"]+)"')
          if (-not $m.Success) { throw 'Embedded swirl artwork not found' }
          $png = [Convert]::FromBase64String($m.Groups[1].Value)
          $ms = New-Object System.IO.MemoryStream
          $bw = New-Object System.IO.BinaryWriter($ms)
          $bw.Write([UInt16]0)
          $bw.Write([UInt16]1)
          $bw.Write([UInt16]1)
          $bw.Write([Byte]0)
          $bw.Write([Byte]0)
          $bw.Write([Byte]0)
          $bw.Write([Byte]0)
          $bw.Write([UInt16]1)
          $bw.Write([UInt16]32)
          $bw.Write([UInt32]$png.Length)
          $bw.Write([UInt32]22)
          $bw.Write($png)
          $bw.Flush()
          [IO.File]::WriteAllBytes('tools/ColourPicker/ColourPicker.ico', $ms.ToArray())
          $bw.Dispose()
          $ms.Dispose()
      - name: Build application icon resource
        shell: cmd
        working-directory: tools\ColourPicker
        run: rc /nologo ColourPicker.rc
      - name: Build native Win32 executable
        shell: cmd
        run: cl /nologo /std:c++17 /O2 /EHsc /DUNICODE /D_UNICODE tools\\ColourPicker\\ColourPicker.cpp tools\\ColourPicker\\ColourPicker.res /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib gdiplus.lib crypt32.lib ole32.lib /OUT:ColourPicker.exe
      - name: Automated tests
        shell: cmd
        run: ColourPicker.exe /test
      - uses: actions/upload-artifact@v4
        with:
          name: ColourPicker-Windows-x64
          path: ColourPicker.exe
