name: Windows beta build
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ctrlzed-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build CtrlZed.csproj -c Release
      - name: Publish portable beta
        run: dotnet publish CtrlZed.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/CtrlZed
      - name: Smoke launch
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited) { throw "CtrlZed exited during smoke launch with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Functional self-test
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "CtrlZed self-test failed with code $($t.ExitCode)"
          }
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content CtrlZed.csproj
          $version = $proj.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "CtrlZed.csproj has no Version value." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "filename=CtrlZed-$version-win-x64" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          $base = "${{ steps.version.outputs.filename }}"
          Compress-Archive -Path artifacts/CtrlZed/* -DestinationPath "artifacts/$base.zip"
          (Get-FileHash "artifacts/$base.zip" -Algorithm SHA256).Hash | Out-File "artifacts/$base.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.filename }}
          path: |
            artifacts/${{ steps.version.outputs.filename }}.zip
            artifacts/${{ steps.version.outputs.filename }}.sha256

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $base = "${{ steps.version.outputs.filename }}"
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          $display = $version -replace '-beta\.', ' beta '
          gh release create $tag "artifacts/$base.zip" "artifacts/$base.sha256" --prerelease --target "${{ github.sha }}" --title "CtrlZed $display" --notes "Beta 21 fixes accumulating dynamic macro menu entries, removes the unstable live pagination reflow that caused flicker/image resizing/text bounce, clarifies top/bottom margin gaps in side guides, fixes the Macro Manager Save & Exit caption, and adopts the new cyan/gold cyber CtrlZed branding."
