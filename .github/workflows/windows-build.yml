name: Windows beta build
on:
  push:
    branches: [ main, beta29, beta30, beta31, beta32, beta33, beta34, beta341, beta342, beta35, beta36, beta37, beta38, beta39, beta40, beta401, beta402, beta403, beta41, beta42, beta43, beta431, beta432, beta44, beta441, beta442, beta443, beta444, beta445, beta45, beta451, beta46, beta461, beta462, beta47, beta48, beta49, beta50, beta501, beta502, beta51, beta52, beta53 ]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ctrlzed-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Prepare pinned Google Fonts catalogue and test fixture
        shell: pwsh
        run: |
          python scripts/test-online-font-catalog.py
          if ($LASTEXITCODE -ne 0) { throw "Font catalogue parser tests failed." }
          python scripts/build-online-font-catalog.py --output OnlineFontCatalogue.json --fixture-directory (Join-Path $env:TEMP "CtrlZed50FontFixture")
          if ($LASTEXITCODE -ne 0) { throw "Pinned font catalogue generation failed." }
      - name: Build
        run: dotnet build CtrlZed.csproj -c Release
      - name: Publish portable beta
        run: dotnet publish CtrlZed.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/CtrlZed
      - name: Smoke launch
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -PassThru
          $ready = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if ($p.HasExited) { throw "CtrlZed exited during smoke launch with code $($p.ExitCode)" }
            if ($p.MainWindowHandle -ne 0 -and $p.Responding) {
              $ready = $true
              break
            }
          }
          if (-not $ready) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "CtrlZed did not create a responsive main window within 10 seconds."
          }
          Stop-Process -Id $p.Id -Force
      - name: Wordplay Workshop associations favourites and document regression
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--wordplay-workshop-test" -PassThru
          if (-not $t.WaitForExit(180000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Wordplay Workshop regression timed out."
          }
          $report = Join-Path $env:TEMP "CtrlZed53WordplayWorkshop.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Wordplay Workshop regression failed with code $($t.ExitCode)"
          }
      - name: Story Workshop conversation metadata and lifecycle regression
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--story-workshop-test" -PassThru
          if (-not $t.WaitForExit(180000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Story Workshop regression timed out."
          }
          $report = Join-Path $env:TEMP "CtrlZed52StoryWorkshop.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Story Workshop regression failed with code $($t.ExitCode)"
          }
      - name: Character voice discovery preview and editing regression
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--character-voice-test" -PassThru
          if (-not $t.WaitForExit(150000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Character voice regression timed out."
          }
          $report = Join-Path $env:TEMP "CtrlZed51CharacterVoice.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Character voice regression failed with code $($t.ExitCode)"
          }
      - name: Functional self-test
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            $progress = Join-Path $env:TEMP "CtrlZedSelfTestProgress.txt"
            if (Test-Path $progress) { Get-Content $progress }
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000; StartTime=(Get-Date).AddMinutes(-10)} -MaxEvents 3 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Message }
            throw "CtrlZed self-test failed with code $($t.ExitCode)"
          }
      - name: Following-style keyboard regression
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--following-style-test" -PassThru
          if (-not $t.WaitForExit(45000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Following-style keyboard test timed out."
          }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Following-style keyboard test failed with code $($t.ExitCode)"
          }
      - name: Menu responsiveness regression
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--menu-performance-test" -PassThru
          if (-not $t.WaitForExit(90000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Menu responsiveness test timed out."
          }
          $report = Join-Path $env:TEMP "CtrlZedMenuResponsiveness.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Menu responsiveness test failed with code $($t.ExitCode)"
          }
      - name: Custom styles and paragraph persistence
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--style45-test" -PassThru
          if (-not $t.WaitForExit(90000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Custom styles and paragraph persistence timed out."
          }
          $report = Join-Path $env:TEMP "CtrlZed45StyleSelfTest.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Custom styles and paragraph persistence failed with code $($t.ExitCode)"
          }
      - name: Text colour menu toolbar and rich editing regression
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--text-colour-test" -PassThru
          if (-not $t.WaitForExit(150000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Text colour regression timed out."
          }
          $report = Join-Path $env:TEMP "CtrlZed501TextColour.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Text colour regression failed with code $($t.ExitCode)"
          }
      - name: Online font discovery preview and per-user installation
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--online-font-test" -PassThru
          if (-not $t.WaitForExit(240000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Online font regression timed out."
          }
          $report = Join-Path $env:TEMP "CtrlZed50OnlineFonts.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Online font regression failed with code $($t.ExitCode)"
          }
      - name: Installed Font Finder search and formatting regression
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--font-finder-test" -PassThru
          if (-not $t.WaitForExit(150000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Font Finder regression timed out."
          }
          $report = Join-Path $env:TEMP "CtrlZed49FontFinder.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Font Finder regression failed with code $($t.ExitCode)"
          }
      - name: Sentence completion context and editing regression
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--sentence-completion-test" -PassThru
          if (-not $t.WaitForExit(150000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Sentence completion regression timed out."
          }
          $report = Join-Path $env:TEMP "CtrlZed48SentenceCompletion.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Sentence completion regression failed with code $($t.ExitCode)"
          }
      - name: Vector signature tracing and persistence
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--vector-signature-test" -PassThru
          if (-not $t.WaitForExit(120000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Vector signature regression timed out."
          }
          $report = Join-Path $env:TEMP "CtrlZed47VectorSignatures.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Vector signature regression failed with code $($t.ExitCode)"
          }
      - name: Paged editing layout and input regression
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--paged-editing-test" -PassThru
          if (-not $t.WaitForExit(120000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Paged editing regression timed out."
          }
          $report = Join-Path $env:TEMP "CtrlZed46PagedEditing.txt"
          if (Test-Path $report) { Get-Content $report }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Paged editing regression failed with code $($t.ExitCode)"
          }
      - name: Capture synthetic paged-layout diagnostics
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @("CtrlZed46Layout.png", "CtrlZed46Page2.png", "CtrlZed47SignaturePreview.png", "CtrlZed48SentenceCompletion.png", "CtrlZed49FontFinder.png", "CtrlZed50OnlineFonts.png", "CtrlZed501TextColour.png", "CtrlZed51CharacterVoice.png", "CtrlZed52StoryWorkshop.png", "CtrlZed53WordplayWorkshop.png")) {
            $path = Join-Path $env:TEMP $name
            if (Test-Path $path) {
              $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($path))
              for ($offset = 0; $offset -lt $encoded.Length; $offset += 2000) {
                $chunk = $encoded.Substring($offset, [Math]::Min(2000, $encoded.Length - $offset))
                Write-Host "CZ46_IMAGE:$name`:$chunk"
              }
            }
          }
      - name: Rich and plain-text paste keyboard regression
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--plain-text-paste-test" -PassThru
          if (-not $t.WaitForExit(90000)) {
            Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            throw "Rich and plain-text paste keyboard regression timed out."
          }
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "Rich and plain-text paste keyboard regression failed with code $($t.ExitCode)"
          }
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content CtrlZed.csproj
          $version = $proj.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "CtrlZed.csproj has no Version value." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "filename=CtrlZed-$version-win-x64" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          $base = "${{ steps.version.outputs.filename }}"
          Compress-Archive -Path artifacts/CtrlZed/* -DestinationPath "artifacts/$base.zip"
          (Get-FileHash "artifacts/$base.zip" -Algorithm SHA256).Hash | Out-File "artifacts/$base.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.filename }}
          path: |
            artifacts/${{ steps.version.outputs.filename }}.zip
            artifacts/${{ steps.version.outputs.filename }}.sha256

      - name: Publish GitHub prerelease
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $base = "${{ steps.version.outputs.filename }}"
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          $display = $version -replace '-beta\.', ' beta '
          gh release create $tag "artifacts/$base.zip" "artifacts/$base.sha256" --prerelease --target "${{ github.sha }}" --title "CtrlZed $display" --notes "Beta 53 adds Review > Wordplay Workshop for exploring associations between words, images and fragments. Independent form, style, comic flavour, device, subject/target and situation choices all start at General. Explicit Explore produces six source-linked directions with two original examples each; edit, copy, keep favourites or explicitly apply a phrase. Word piles, settings, results and favourite provenance travel with native .czd files, password protection and recovery alongside Story Workshop. No AI request occurs on opening or local editing; requests send only the supplied pile, options and optional target. Captured manuscript destinations and asynchronous generations reject stale changes. All earlier release gates are retained. Beta 52 is the accepted baseline; Page Editing floating-picture issue #30 remains deferred."
