name: Windows beta build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build CtrlZed.csproj -c Release
      - name: Publish portable beta
        run: dotnet publish CtrlZed.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/CtrlZed
      - name: Smoke launch
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited) { throw "CtrlZed exited during smoke launch with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/CtrlZed/* -DestinationPath artifacts/CtrlZed-0.1.0-beta.1-win-x64.zip
          (Get-FileHash artifacts/CtrlZed-0.1.0-beta.1-win-x64.zip -Algorithm SHA256).Hash | Out-File artifacts/CtrlZed-0.1.0-beta.1-win-x64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: CtrlZed-0.1.0-beta.1-win-x64
          path: |
            artifacts/CtrlZed-0.1.0-beta.1-win-x64.zip
            artifacts/CtrlZed-0.1.0-beta.1-win-x64.sha256
