name: Windows beta build
on:
  push:
    branches: [ main, beta29, beta30, beta31, beta32, beta33, beta34, beta341, beta342, beta35, beta36, beta37, beta38, beta39 ]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ctrlzed-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build CtrlZed.csproj -c Release
      - name: Publish portable beta
        run: dotnet publish CtrlZed.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/CtrlZed
      - name: Smoke launch
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -PassThru
          $ready = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if ($p.HasExited) { throw "CtrlZed exited during smoke launch with code $($p.ExitCode)" }
            if ($p.MainWindowHandle -ne 0 -and $p.Responding) {
              $ready = $true
              break
            }
          }
          if (-not $ready) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "CtrlZed did not create a responsive main window within 10 seconds."
          }
          Stop-Process -Id $p.Id -Force
      - name: Functional self-test
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($t.ExitCode -ne 0) {
            $failure = Join-Path $env:TEMP "CtrlZedSelfTestFailure.txt"
            if (Test-Path $failure) { Get-Content $failure }
            throw "CtrlZed self-test failed with code $($t.ExitCode)"
          }
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content CtrlZed.csproj
          $version = $proj.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "CtrlZed.csproj has no Version value." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "filename=CtrlZed-$version-win-x64" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          $base = "${{ steps.version.outputs.filename }}"
          Compress-Archive -Path artifacts/CtrlZed/* -DestinationPath "artifacts/$base.zip"
          (Get-FileHash "artifacts/$base.zip" -Algorithm SHA256).Hash | Out-File "artifacts/$base.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.filename }}
          path: |
            artifacts/${{ steps.version.outputs.filename }}.zip
            artifacts/${{ steps.version.outputs.filename }}.sha256

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $base = "${{ steps.version.outputs.filename }}"
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          $display = $version -replace '-beta\.', ' beta '
          gh release create $tag "artifacts/$base.zip" "artifacts/$base.sha256" --prerelease --target "${{ github.sha }}" --title "CtrlZed $display" --notes "Beta 39 adds a named image library in Tools > Profile Images. Upload supported image files, assign a name such as signature, and use the image from safe or trusted compiled macros. The safe macro command INSERT_PROFILE_IMAGE {signature} 40 IN_FRONT inserts the stored image at the caret with aspect ratio retained and the selected placement. Portable CtrlZed profiles include stored images. Beta 38 image placement, movement and resizing are retained. The release gate includes the Windows build, self-contained publish, launch smoke test and functional self-test."

# Beta 35 release build
