name: Windows beta build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build CtrlZed.csproj -c Release
      - name: Publish portable beta
        run: dotnet publish CtrlZed.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/CtrlZed
      - name: Smoke launch
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "artifacts/CtrlZed/CtrlZed.exe" -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited) { throw "CtrlZed exited during smoke launch with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Functional self-test
        shell: pwsh
        run: |
          & "artifacts/CtrlZed/CtrlZed.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "CtrlZed self-test failed with code $LASTEXITCODE" }
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/CtrlZed/* -DestinationPath artifacts/CtrlZed-0.6.0-beta.6-win-x64.zip
          (Get-FileHash artifacts/CtrlZed-0.6.0-beta.6-win-x64.zip -Algorithm SHA256).Hash | Out-File artifacts/CtrlZed-0.6.0-beta.6-win-x64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: CtrlZed-0.6.0-beta.6-win-x64
          path: |
            artifacts/CtrlZed-0.6.0-beta.6-win-x64.zip
            artifacts/CtrlZed-0.6.0-beta.6-win-x64.sha256

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.6.0-beta.6"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag artifacts/CtrlZed-0.6.0-beta.6-win-x64.zip artifacts/CtrlZed-0.6.0-beta.6-win-x64.sha256 --prerelease --target "${{ github.sha }}" --title "CtrlZed 0.6.0 beta 6" --notes "Beta 6 adds Find/Replace, manual page breaks, native FlowDocument tables, bullets/numbering and paragraph alignment controls. Use copies of important documents."
          } else {
            Write-Host "Prerelease $tag already exists; leaving it unchanged."
          }
